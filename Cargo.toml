[package]
name = "delivery"
version = "0.1.0"
edition = "2024"

[profile.dev.package."*"]
opt-level = 3

[dependencies]
ash = "0.38.0"
ash-window = "0.13.0"   

winit = { version = "0.30.12", features = ["rwh_06"] }

gpu-allocator = { version = "0.28.0", features = ["vulkan"] }  

slotmap = "1.1.1"
bytemuck = { version = "1.24.0", features = ["derive"] }

tracing = "0.1.44"
thiserror = "2.0.17"
profiling = "1.0.17"
parking_lot = "0.12.5"
tracing-subscriber = "0.3.23"

gltf = { version = "1.4.1", features = ["KHR_texture_transform"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
glam = "0.30.5"

smol = "2.0.2"

rapier3d = "0.32.0"

egui-ash-renderer = "0.11.0"
egui = "0.33"
egui-winit = "0.33"
egui_demo_lib = "0.33"
egui_extras = { version = "0.33", default-features = false, features = ["all_loaders"] }
dolly = "0.6.0"

mint = "0.5.8"
rodio = { version = "0.22.2", features = ["mp3"] }
iced_runtime = "0.14.0"
