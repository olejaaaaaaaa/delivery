[package]
name = "delivery"
version = "0.1.0"
edition = "2024"

[dependencies]
ash = "0.38.0"
ash-window = "0.13.0"                                
gpu-allocator = { version = "0.28.0", features = ["vulkan"] }     
winit = { version = "0.30.12", features = ["rwh_06"] }
slotmap = "1.1.1"
bytemuck = { version = "1.24.0", features = ["derive"] }
tracing = "0.1.44"
thiserror = "2.0.17"
profiling = "1.0.17"
parking_lot = "0.12.5"
tracing-subscriber = "0.3.23"
gltf = "1.4.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
egui = { version = "0.34.1", default-features = false }
glam = "0.30.5"
egui-winit = "0.34.1"
smol = "2.0.2"
rapier3d = "0.32.0"
egui-ash-renderer = "0.11.0"
